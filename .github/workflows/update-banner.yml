# Regenerates banner.svg daily (and on demand) and commits it back only if it changed.
#
# Note: the built-in Actions GITHUB_TOKEN can't read a user's GraphQL contribution
# calendar, so with it alone the card shows everything except contributions and streak.
# To include those, create a personal access token (classic, `read:user` scope) and add
# it as a repository secret named GH_PAT (Settings → Secrets and variables → Actions).
# The run step below uses GH_PAT as GITHUB_TOKEN when it exists.
name: Update banner

on:
  schedule:
    - cron: "0 0 * * *"  # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - run: python git_banner.py
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Commit banner.svg if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner.svg
          git diff --cached --quiet || { git commit -m "chore: update banner.svg"; git push; }
